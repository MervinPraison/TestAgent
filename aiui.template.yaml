# Generated by praisonaiui.mkdocs_import from mkdocs.yml.
# The MkDocs file is left unchanged. aiui build reads this file.
# Dropped: mkdocstrings: API pages are not generated from docstrings
# Dropped: pymdownx.snippets includes are not expanded; the include lines stay in the page.
# Dropped: extra_css is not copied
# Dropped: ignored YAML tag !!python/name:pymdownx.superfences.fence_code_format
schemaVersion: 1
site:
  title: TestAgent Automation
  ui: shadcn
  theme:
    preset: paper
    radius: md
    mode: system
  description: The world's easiest way to test anything using AI
seo:
  siteUrl: https://testagent.praison.ai
navigation:
  tabs:
  - tab: Docs
    groups:
    - group: Get started
      pages:
      - index
      icon: rocket
    - group: Getting Started
      pages:
      - getting-started/installation
      - getting-started/quickstart
      - getting-started/cli
      icon: rocket
      prefix: getting-started
    - group: Core Concepts
      pages:
      - concepts/testing
      - concepts/results
      - concepts/configuration
      icon: book-open
      prefix: concepts
    - group: Features
      pages:
      - features/assertions
      - features/outcomes
      - features/decorators
      - features/parametrize
      - features/fixtures
      - features/caching
      - features/timing
      - features/discovery
      - features/parallel
      icon: book-open
      prefix: features
    - group: API Reference
      pages:
      - api/core
      - api/assertions
      - api/decorators
      - api/cli
      icon: terminal
      prefix: api
    - group: Examples
      pages:
      - examples/basic
      - examples/advanced
      icon: code
      prefix: examples
    - group: TypeScript SDK
      pages:
      - typescript/index
      - typescript/api
      - typescript/cli
      - typescript/examples
      icon: book-open
      prefix: typescript
navbar:
  primary:
    type: button
    label: Quick start
    href: /docs/getting-started/installation
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/TestAgent
footer:
  socials:
    github: https://github.com/MervinPraison/TestAgent
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
    nav:
      mode: manual
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: TestAgent Automation
  footer_main:
    type: Footer
    props:
      text: TestAgent Automation
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
